<source src="script.js"></source>
<source src="style.css"></source>

<div id ="calculator">
  <h1>Calculator</h1>
<div id="display">  </div>

<div class="row">
  
  <button class="buttons digit" onclick="appendToResult('7')">7</button>
  <button class="buttons digit" onclick="appendToResult('8')">8</button>
  <button class="buttons digit" onclick="appendToResult('9')">9</button>
  <button class="buttons operator" onclick="appendToResult('/')">/</button>
  <br>
  <button class="buttons digit" onclick="appendToResult('4')">4</button>
  <button class="buttons digit" onclick="appendToResult('5')">5</button>
  <button class="buttons digit" onclick="appendToResult('6')">6</button>
  <button class="buttons operator" onclick="appendToResult('*')">*</button>
  <br>
  <button class="buttons digit" onclick="appendToResult('1')">1</button>
  <button class="buttons digit" onclick="appendToResult('2')">2</button>
  <button class="buttons digit" onclick="appendToResult('3')">3</button>
  <button class="buttons operator" onclick="appendToResult('-')">-</button>
  <br>
  <button class="buttons digit" onclick="appendToResult('0')">0</button>
  <button class="buttons operator" onclick="appendToResult('.')">.</button>
  <button class="buttons operator" onclick="calculateResult()">=</button>
  <button class="buttons operator" onclick="appendToResult('+')">+</button>
  <br>
  <button class="buttons operator" onclick="clearResult()">CLEAR</button>
  <button class="buttons operator" onclick="deleteLast()">BACKSPACE</button>
</div>
